name: 💡 提交新套路 / 新选题
description: 贡献一个值得科普的金融消费套路，或一个新的知识路径
title: "[新条目] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好选题的标准是：**反差强 + 受众广 + 有官方背书**。

  - type: input
    id: title
    attributes:
      label: 📢 条目名称
      placeholder: "存单变保单"
    validations:
      required: true

  - type: textarea
    id: script
    attributes:
      label: 💬 典型话术
      description: 销售/机构实际怎么说这句话的？越具体越好
      placeholder: |
        "这个就是存款，随时可以取"
        "收益比定期高，还能保本"
    validations:
      required: true

  - type: textarea
    id: mechanism
    attributes:
      label: ⚙️ 运作机制
      description: 为什么能骗到人？信息差在哪？
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 🔗 官方背书
      description: 监管风险提示 / 法律条文 / 消保案例。**没有官方背书的"我觉得是套路"不予收录**
      placeholder: "金融监管总局 2023 年《关于...的风险提示》"
    validations:
      required: true

  - type: textarea
    id: action
    attributes:
      label: ✅ 识别与应对动作
      description: 普通人当场能做什么？
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 📂 归类
      options:
        - 分期信贷类
        - 保险类
        - 投资理财类
        - 税务用工类
        - 其他
    validations:
      required: true
