name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: IRR 计算脚本 · 行为测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行测试（86 项断言）
        working-directory: skills/money-finance-advice/scripts
        run: python test_irr_calc.py

      - name: CLI 冒烟测试
        working-directory: skills/money-finance-advice/scripts
        shell: bash
        run: |
          python irr_calc.py installment --principal 12000 --months 12 --monthly-fee-rate 0.006
          python irr_calc.py insurance --premiums 100000,100000,100000,100000,100000 --cash-value 650000 --year 10
          python irr_calc.py loan --principal 1000000 --months 360 --annual-rate 0.0385
          python irr_calc.py irr --cashflow=-12000,1072,1072,1072,1072,1072,1072,1072,1072,1072,1072,1072,1072
          python irr_calc.py benford --numbers 1234,2345,3456,4567,5678,6789,7891,8912

      - name: 校验 SKILL.md frontmatter
        shell: bash
        run: |
          head -5 skills/money-finance-advice/SKILL.md | grep -q "^name: money-finance-advice" \
            && echo "frontmatter name OK" \
            || (echo "frontmatter name 缺失或不匹配" && exit 1)
